<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weekend">
<title>Partir ce weekend</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#0B1B2B; --bg2:#0F2336; --card:#132B41; --card2:#183450; --line:#22425F;
  --ink:#EEF3F7; --ink2:#9CB1C4; --ink3:#6E879C;
  --amber:#FFB81C; --amber2:#FFD983; --green:#43D98F; --red:#FF8A7A;
  --disp:"Bricolage Grotesque",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--disp);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto}

/* en-tete facon tableau des departs */
header{padding:calc(20px + env(safe-area-inset-top)) 16px 14px;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,184,28,.16),transparent 60%),var(--bg)}
.board{display:flex;gap:8px;align-items:center;font:600 11px/1 var(--mono);letter-spacing:.14em;color:var(--amber);text-transform:uppercase}
.board i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
h1{margin:10px 0 4px;font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--amber)}
.sub{margin:0;color:var(--ink2);font-size:14px}

/* barre collante : mode + mois/weekends */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,27,43,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.modes{display:flex;gap:18px;padding:10px 16px 0}
.modes button{border:0;background:none;padding:4px 0 8px;font-size:15px;font-weight:800;color:var(--ink3);border-bottom:2px solid transparent}
.modes button.on{color:var(--ink);border-color:var(--amber)}
.rail{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.wk{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px 8px;text-align:left;min-width:92px}
.wk b{display:block;font-weight:600;font-size:15px;white-space:nowrap}
.wk span{display:block;font:500 11px/1.3 var(--mono);color:var(--ink3);margin-top:2px;white-space:nowrap}
.wk.on{background:var(--amber);border-color:var(--amber);color:#1B1300}
.wk.on span{color:#5A4200}
.wk.soon{opacity:.6}
.wk.cal{position:relative;display:flex;align-items:center;gap:6px;color:var(--ink2);min-width:0}
.wk.cal input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* commandes */
.ctrl{padding:14px 16px 0;display:grid;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 2px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.row2{display:flex;gap:8px}
.search{flex:1 1 0;width:0;min-width:0;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:8px 14px;font-size:16px}
.search::placeholder{color:var(--ink3)}
.search:not(:placeholder-shown){border-color:var(--green)}
.fbtn{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink2)}
.fbtn.on{border-color:var(--green);color:var(--green);background:rgba(67,217,143,.1)}
.fbtn .n{background:var(--green);color:#062414;border-radius:999px;min-width:20px;height:20px;padding:0 6px;font:600 12px/20px var(--mono);text-align:center}

/* panneau de filtres */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px 12px 4px}
.fg{margin-bottom:12px}
.fg h5{margin:0 0 7px;font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.chip.on{border-color:var(--green);color:var(--green);background:rgba(67,217,143,.12)}
.pfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:10px 0 8px}
.pfoot button{border:0;background:none;padding:4px 0;font-weight:600;font-size:13px;color:var(--ink2)}
.pfoot button.ok{color:var(--amber)}

.count{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 4px;font:500 12px/1.4 var(--mono);color:var(--ink3);letter-spacing:.02em}
.count b{color:var(--amber2);font-weight:600}
.fbtn.dice{padding:8px 11px;font-size:16px;border-color:var(--amber)}

/* cartes destination */
.list{display:grid;gap:10px;padding:6px 16px}
.grp{margin:14px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:17px;font-weight:800}
.grp span{font:500 12px/1 var(--mono);color:var(--ink3)}
.card{display:grid;grid-template-columns:78px 1fr;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#2E5578}
.card:active{background:var(--card2)}
.card.done{opacity:.5}
.card.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 2px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
.ph{position:relative;background:var(--card2) center/cover no-repeat}
.ph.no .code{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);font-size:15px;background:none}
.ph .code{position:absolute;left:6px;bottom:6px;font:600 11px/1 var(--mono);letter-spacing:.08em;background:rgba(11,27,43,.85);color:var(--amber);padding:4px 5px;border-radius:5px}
.main{padding:11px 12px 10px;min-width:0}
.hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hd h3{margin:0;font-size:18px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.hd h3 .star{color:var(--amber)}
.hd p{margin:2px 0 0;color:var(--ink3);font-size:13px}
.px{text-align:right;flex:none}
.px small{display:block;font:500 10px/1 var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.1em}
.px b{font:600 22px/1.1 var(--mono);color:var(--amber)}
.duo{display:block;font:500 11px/1.3 var(--mono);color:var(--ink2);margin-top:3px;white-space:nowrap}
.opts{margin-top:8px;display:grid;gap:4px}
.opt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-decoration:none;background:var(--bg2);border-radius:9px;padding:6px 10px;font-size:13px}
a.opt:active{background:var(--card2)}
.opt .l{min-width:0;display:grid;gap:1px}
.opt .f{font:600 11px/1.2 var(--mono);color:var(--ink2);letter-spacing:.02em}
.opt .f i{font-style:normal;color:var(--ink3)}
.opt .d{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir{color:var(--green)}
.opt .p{font:600 14px/1 var(--mono);text-align:right}
.opt.best .p{color:var(--amber)}
.tr{display:block;font:600 11px/1.2 var(--mono);margin-top:3px}
.tr.down{color:var(--green)} .tr.up{color:var(--red)}
.more{margin-top:5px;font-size:12px;color:var(--ink3)}
.ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.facts{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;color:var(--ink2);min-width:0}
.ico{display:flex;gap:6px;flex:none}
.ib{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);color:var(--ink3);font-size:15px;line-height:1;display:grid;place-items:center;padding:0}
.ib.fav.on{color:var(--amber);border-color:var(--amber);background:rgba(255,184,28,.12)}
.ib.done.on{color:var(--green);border-color:var(--green);background:rgba(67,217,143,.12)}

/* carte */
#map{height:calc(100vh - 290px);min-height:360px;margin:6px 16px;border-radius:16px;border:1px solid var(--line);background:var(--bg2)}
.leaflet-container{font-family:var(--disp);background:#0d1f30}
.leaflet-tile-pane{filter:invert(1) hue-rotate(190deg) brightness(.85) contrast(.9) saturate(.6)}
.pin{background:none;border:0}
.pin div{transform:translate(-50%,-100%);display:inline-block;white-space:nowrap;background:var(--amber);color:#1B1300;border-radius:8px;padding:3px 6px 4px;font:600 12px/1.1 var(--mono);box-shadow:0 4px 12px rgba(0,0,0,.4);position:relative}
.pin div::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--amber)}
.pin div small{display:block;font:600 10px/1.1 var(--disp);color:#5A4200}
.pin.home div{background:var(--green)}
.pin.home div::after{border-top-color:var(--green)}

/* fiche destination */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(4,10,18,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:720px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:0;animation:up .25s ease;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.hero{position:relative;height:190px;background:var(--card2) center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,27,43,0) 30%,var(--bg))}
/* croix toujours visible : barre collante de hauteur nulle au-dessus du contenu */
.xbar{position:sticky;top:0;height:0;z-index:5;display:flex;justify-content:flex-end}
.xbar .x{margin:12px 12px 0 0;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(11,27,43,.85);color:var(--ink);font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sh{position:relative;z-index:1;margin-top:-54px;padding:0 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sh h2{margin:0;font-size:32px;font-weight:800;line-height:1;letter-spacing:-.02em}
.sh .ctry{color:var(--ink2);margin-top:4px}
.sh .ico .ib{width:40px;height:40px;font-size:18px}
.sec{margin:18px 16px 0}
.sec h4{margin:0 0 8px;font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.muted{color:var(--ink3);font-size:13px}
.note{margin:6px 0 0}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.day{flex:1 0 76px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.day .e{font-size:24px;line-height:1.2}
.day b{display:block;font:600 14px/1.2 var(--mono)}
.day small{display:block;color:var(--ink3);font-size:11px}
.clim{display:flex;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.clim div{flex:1 0 90px}
.clim b{display:block;font:600 18px/1.2 var(--mono)}
.clim small{color:var(--ink3);font-size:12px}
.guide{font-size:14px;line-height:1.55;color:var(--ink2)}
.guide p{margin:0 0 8px}
.guide a{color:var(--amber);font-weight:600}
.bud{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.bud div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.bud div:last-child{border:0;font-weight:800}
.bud span{color:var(--ink2)}
.bud b{font:600 14px/1.3 var(--mono);white-space:nowrap}
.bud div:last-child b{color:var(--amber);font-size:17px}
.kv{display:grid;gap:6px;font-size:14px;color:var(--ink2)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:block;text-align:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 8px;font-weight:600;font-size:14px}
.btn.full{grid-column:1/-1}
.btn.main{background:var(--amber);border-color:var(--amber);color:#1B1300}

/* etats */
.empty{margin:18px 16px;padding:18px;border:1px dashed var(--line);border-radius:16px;color:var(--ink2);font-size:14px}
.empty h2{margin:0 0 6px;color:var(--ink);font-size:18px}
.empty a{color:var(--amber)}
footer{padding:18px 16px 0;color:var(--ink3);font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="board"><i></i>Départs · BOD · Bordeaux-Mérignac</div>
    <h1>Où on part<br><em>ce weekend</em> ?</h1>
    <p class="sub">Toutes les destinations, toutes les compagnies, prix Google Flights.</p>
  </header>
  <nav class="bar">
    <div class="modes" id="modes"></div>
    <div class="rail" id="rail"></div>
  </nav>
  <div id="app"></div>
  <footer id="foot"></footer>
</div>
<div id="sheet"></div>

<script>
var WEEKENDS = 12;   // weekends couverts par le robot (cf scripts/fetch.mjs)
var DAILY = 100;     // depenses sur place pour 2 par jour en France (repas, sorties, transports)
var BUDGETS = [80, 120, 150, 200, 300];
var MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
var MOISL = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
var JOURS = ["dim", "lun", "mar", "mer", "jeu", "ven", "sam"];
var DEP_DAYS = [3, 4, 5, 6];   // mer -> sam
var NIGHTS = [2, 3, 4];
var BOD = [44.8283, -0.7156];

var DEFAULTS = { direct: false, down: false, favOnly: false, hideDone: false, max: 0, sort: "price", group: "none", days: [], nights: [] };
var S = Object.assign({ data: null, mode: "month", month: null, wk: null, view: "list", q: "", panel: false }, JSON.parse(JSON.stringify(DEFAULTS)));
try { Object.assign(S, JSON.parse(localStorage.getItem("wk-prefs") || "{}")); } catch (e) {}
S.month = null; S.wk = null; S.q = ""; S.panel = false;
if (!Array.isArray(S.days)) S.days = [];
if (!Array.isArray(S.nights)) S.nights = [];

function loadSet(k) { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch (e) { return []; } }
var FAV = loadSet("wk-fav"), DONE = loadSet("wk-done");
function toggleIn(arr, v) { var i = arr.indexOf(v); if (i === -1) arr.push(v); else arr.splice(i, 1); }
function saveSets() { try { localStorage.setItem("wk-fav", JSON.stringify(FAV)); localStorage.setItem("wk-done", JSON.stringify(DONE)); } catch (e) {} }
function savePrefs() {
  var p = { mode: S.mode, view: S.view };
  Object.keys(DEFAULTS).forEach(function (k) { p[k] = S[k]; });
  try { localStorage.setItem("wk-prefs", JSON.stringify(p)); } catch (e) {}
}
var CUR = {};        // destinations affichees, par cle
var MAP = null, SHEET = null;

// ---------- dates ----------
function pd(s) { var p = s.split("-"); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function iso(d) { return d.toISOString().slice(0, 10); }
function add(s, n) { var d = pd(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); }
function today() { return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Paris" }).format(new Date()); }
function daysBetween(a, b) { return Math.round((pd(b) - pd(a)) / 864e5); }
function daysTo(s) { return daysBetween(today(), s); }
function dow(s) { return pd(s).getUTCDay(); }
// Vendredi du weekend en cours (sam/dim) ou a venir (lun-ven), comme le robot
function fridayOf(s) {
  var d = dow(s);
  if (d === 6) return add(s, -1);
  if (d === 0) return add(s, -2);
  return add(s, 5 - d);
}
function fridays() {
  var f = fridayOf(today()), out = [];
  for (var i = 0; i < WEEKENDS; i++) { out.push(f); f = add(f, 7); }
  return out;
}
function wkLabel(fri) {
  var sa = pd(add(fri, 1)), su = pd(add(fri, 2));
  return sa.getUTCMonth() === su.getUTCMonth()
    ? sa.getUTCDate() + "-" + su.getUTCDate() + " " + MOIS[su.getUTCMonth()]
    : sa.getUTCDate() + " " + MOIS[sa.getUTCMonth()] + " - " + su.getUTCDate() + " " + MOIS[su.getUTCMonth()];
}
function monthLabel(ym, short) {
  var p = ym.split("-"), m = +p[1] - 1;
  return (short ? MOIS[m] : MOISL[m]) + (p[0] !== today().slice(0, 4) ? " " + p[0] : "");
}
function day(s) { var d = pd(s); return JOURS[d.getUTCDay()] + " " + d.getUTCDate(); }
function dayM(s) { var d = pd(s); return day(s) + " " + MOIS[d.getUTCMonth()]; }
function span(out, ret) { return (pd(out).getUTCMonth() === pd(ret).getUTCMonth() ? day(out) : dayM(out)) + " → " + dayM(ret); }
function nightsTxt(n) { return n + (n > 1 ? " nuits" : " nuit"); }
function dm(s) { var d = pd(s); return d.getUTCDate() + "/" + String(d.getUTCMonth() + 1).padStart(2, "0"); }
function yymmdd(s) { return s.slice(2, 4) + s.slice(5, 7) + s.slice(8, 10); }
function ago(isoTs) {
  if (!isoTs) return "";
  var n = daysBetween(isoTs.slice(0, 10), today());
  return n <= 0 ? "aujourd'hui" : n === 1 ? "hier" : "il y a " + n + " j";
}

// ---------- formats ----------
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function norm(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function eur(n) { return Math.round(n) + " €"; }
function dur(m) { if (!m) return ""; var h = Math.floor(m / 60), mn = m % 60; return h ? h + " h" + (mn ? " " + String(mn).padStart(2, "0") : "") : mn + " min"; }
function stops(n) { return n === 0 ? '<span class="dir">Direct</span>' : n == null ? "" : n + (n > 1 ? " escales" : " escale"); }
function airlines(s) { return String(s || "").split(/\s+et\s+|,\s*/).map(function (a) { return a.trim(); }).filter(Boolean); }

// ---------- liens ----------
// Lien Google Flights pre-rempli : parametre tfs = recherche encodee en protobuf puis base64url
// (le parametre q= en texte libre ne remplit plus la recherche)
function pbVar(n) { var o = []; while (n > 127) { o.push((n & 127) | 128); n >>>= 7; } o.push(n); return o; }
function pbStr(f, s) { var b = Array.from(new TextEncoder().encode(s)); return pbVar(f << 3 | 2).concat(pbVar(b.length), b); }
function pbMsg(f, a) { return pbVar(f << 3 | 2).concat(pbVar(a.length), a); }
function pbNum(f, v) { return pbVar(f << 3).concat(pbVar(v)); }
function pbLeg(date, from, to) { return pbStr(2, date).concat(pbMsg(13, pbStr(2, from)), pbMsg(14, pbStr(2, to))); }
function gf(x, out, ret) {
  if (!x.code) return "https://www.google.com/travel/flights?hl=fr&curr=EUR&q=" + encodeURIComponent("Vols Bordeaux " + x.city + " " + out + " " + ret);
  // legs aller/retour, 1 adulte, eco, aller-retour
  var b = pbMsg(3, pbLeg(out, "BOD", x.code)).concat(pbMsg(3, pbLeg(ret, x.code, "BOD")), pbMsg(8, [1]), pbNum(9, 1), pbNum(19, 1));
  var tfs = btoa(String.fromCharCode.apply(null, b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return "https://www.google.com/travel/flights?tfs=" + tfs + "&hl=fr&curr=EUR";
}
function sky(x, out, ret) {
  return x.code ? "https://www.skyscanner.fr/transport/vols/bod/" + x.code.toLowerCase() + "/" + yymmdd(out) + "/" + yymmdd(ret) + "/" : null;
}
function skyAll(fri) { return "https://www.skyscanner.fr/transport/vols-depuis/bod/" + yymmdd(fri) + "/" + yymmdd(add(fri, 2)) + "/"; }
function booking(x, out, ret) {
  return "https://www.booking.com/searchresults.fr.html?ss=" + encodeURIComponent(x.city + ", " + x.country) + "&checkin=" + out + "&checkout=" + ret + "&group_adults=2&no_rooms=1";
}
function airbnb(x, out, ret) {
  return "https://www.airbnb.fr/s/" + encodeURIComponent(x.city + "--" + x.country) + "/homes?checkin=" + out + "&checkout=" + ret + "&adults=2";
}
function gHotels(x) { return "https://www.google.com/travel/search?q=" + encodeURIComponent("hôtels " + x.city) + "&hl=fr&curr=EUR"; }
function transit(x) {
  return "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(x.code + " airport") + "&destination=" + encodeURIComponent(x.city + ", " + x.country) + "&travelmode=transit";
}

// ---------- donnees ----------
function months() {
  if (!S.data) return [];
  var m = today().slice(0, 7);
  return Object.keys(S.data.months || {}).filter(function (k) { return k >= m && S.data.months[k].dests.length; }).sort();
}
function combos(fri) {
  var w = S.data.weekends && S.data.weekends[fri];
  return w ? Object.keys(w).map(function (k) { return w[k]; }).filter(function (c) { return c.out >= today(); }) : [];
}
function minWk(fri) {
  var m = Infinity;
  combos(fri).forEach(function (c) { if (c.dests.length) m = Math.min(m, c.dests[0].price); });
  return m;
}
function hasWeekendData() { return fridays().some(function (f) { return combos(f).length; }); }

// Options brutes de la vue courante : { d, out, ret }
function rawOptions() {
  var out = [];
  if (S.mode === "month") {
    var m = S.data.months && S.data.months[S.month];
    if (!m) return null;
    m.dests.forEach(function (d) { if (d.out >= today()) out.push({ d: d, out: d.out, ret: d.ret }); });
  } else {
    var cs = combos(S.wk);
    if (!cs.length) return null;
    cs.forEach(function (c) { c.dests.forEach(function (d) { out.push({ d: d, out: c.out, ret: c.ret }); }); });
  }
  return out;
}

function build() {
  var raw = rawOptions();
  if (!raw) return null;
  var by = {};
  raw.forEach(function (r) {
    var d = r.d, n = daysBetween(r.out, r.ret);
    if (S.direct && d.stops !== 0) return;
    if (S.max && d.price > S.max) return;
    if (S.days.length && S.days.indexOf(dow(r.out)) === -1) return;
    if (S.nights.length && S.nights.indexOf(Math.min(n, 4)) === -1) return;
    var k = d.code || d.city;
    var x = by[k] || (by[k] = { key: k, city: d.city, country: d.country, code: d.code, img: d.img, lat: d.lat, lng: d.lng, opts: [] });
    if (!x.img && d.img) x.img = d.img;
    if (x.lat == null && d.lat != null) { x.lat = d.lat; x.lng = d.lng; }
    if (d.hotel != null && (x.hotel == null || d.hotel < x.hotel)) x.hotel = d.hotel;
    if (d.km != null) x.km = d.km;
    x.opts.push({ out: r.out, ret: r.ret, nights: n, price: d.price, prev: d.prev, duration: d.duration, stops: d.stops, airline: d.airline });
  });
  var q = norm(S.q);
  var list = Object.keys(by).map(function (k) { return by[k]; }).filter(function (x) {
    if (S.favOnly && FAV.indexOf(x.city) === -1) return false;
    if (S.hideDone && DONE.indexOf(x.city) !== -1) return false;
    if (S.down && !x.opts.some(function (o) { return o.prev != null && o.price < o.prev; })) return false;
    return !q || norm(x.city + " " + x.country + " " + x.code + " " + x.opts.map(function (o) { return o.airline; }).join(" ")).indexOf(q) !== -1;
  });
  list.forEach(function (x) {
    x.opts.sort(function (a, b) { return a.price - b.price || a.out.localeCompare(b.out); });
    x.cheap = x.opts[0];
    x.best = x.cheap.price;
    x.fast = Math.min.apply(null, x.opts.map(function (o) { return o.duration || 9999; }));
    x.budget = budget(x, x.cheap);
  });
  list.sort(function (a, b) {
    if (S.sort === "duration") return a.fast - b.fast || a.best - b.best;
    if (S.sort === "name") return a.city.localeCompare(b.city, "fr");
    if (S.sort === "budget") return a.budget.total - b.budget.total;
    return a.best - b.best;
  });
  CUR = {};
  list.forEach(function (x) { CUR[x.key] = x; });
  return list;
}

// Budget pour 2 : vols x2 + hotel x nuits + depenses sur place ajustees au cout de la vie
function costIdx(x) { return S.data.cost && S.data.cost[x.country]; }
function budget(x, o) {
  var nights = Math.max(1, daysBetween(o.out, o.ret));
  var idx = costIdx(x) || 100;
  var b = { nights: nights, flights: o.price * 2, hotel: x.hotel ? x.hotel * nights : null, onsite: Math.round(DAILY * nights * idx / 100 / 10) * 10 };
  b.total = b.flights + (b.hotel || 0) + b.onsite;
  return b;
}
function trend(o) {
  if (o.prev == null || Math.abs(o.price - o.prev) < 5) return "";
  var d = o.price - o.prev;
  return '<em class="tr ' + (d < 0 ? "down" : "up") + '">' + (d < 0 ? "↓ " : "↑ ") + Math.abs(Math.round(d)) + " €</em>";
}
function costTxt(x) {
  var i = costIdx(x); if (!i) return "";
  var d = i - 100;
  return Math.abs(d) < 5 ? "prix comme en France" : (d < 0 ? Math.abs(d) + " % moins cher qu'en France" : d + " % plus cher qu'en France");
}
function activeCount() {
  return (S.direct ? 1 : 0) + (S.down ? 1 : 0) + (S.favOnly ? 1 : 0) + (S.hideDone ? 1 : 0) + (S.max ? 1 : 0) + (S.days.length ? 1 : 0) + (S.nights.length ? 1 : 0);
}

function optRow(x, o, best, link) {
  var bits = [nightsTxt(o.nights), o.airline && esc(o.airline), stops(o.stops), dur(o.duration)].filter(Boolean).join(" · ");
  var inner = '<span class="l"><span class="f">' + span(o.out, o.ret) + '</span><span class="d">' + bits + '</span></span><span class="p">' + eur(o.price) + trend(o) + "</span>";
  return link
    ? '<a class="opt' + (best ? " best" : "") + '" href="' + gf(x, o.out, o.ret) + '" target="_blank" rel="noopener">' + inner + "</a>"
    : '<div class="opt' + (best ? " best" : "") + '">' + inner + "</div>";
}

function icons(x) {
  var fav = FAV.indexOf(x.city) !== -1, done = DONE.indexOf(x.city) !== -1;
  return '<div class="ico"><button class="ib fav' + (fav ? " on" : "") + '" data-fav="' + esc(x.city) + '" aria-label="Favori" title="Favori">' + (fav ? "★" : "☆") + "</button>" +

function card(x) {
  var fav = FAV.indexOf(x.city) !== -1, done = DONE.indexOf(x.city) !== -1;
  var ci = costIdx(x);
  var facts = [x.hotel ? "🏨 " + eur(x.hotel) + "/nuit" : "", ci ? "💰 vie " + (ci < 100 ? "−" : "+") + Math.abs(ci - 100) + " %" : "", x.km != null ? "🚌 aéroport à " + x.km + " km" : ""].filter(Boolean);
  var shown = x.opts.slice(0, 3), more = x.opts.length - shown.length;

    '<div class="ph' + (x.img ? "" : " no") + '"' + (x.img ? ' style="background-image:url(\'' + esc(x.img) + '\')"' : "") + ">" +

    '<div class="main"><div class="hd"><div><h3>' + (fav ? '<span class="star">★</span> ' : "") + esc(x.city) + "</h3><p>" + esc(x.country) + (done ? " · déjà fait" : "") + "</p></div>" +

    (more > 0 ? '<div class="more">+ ' + more + (more > 1 ? " autres dates" : " autre date") + "</div>" : "") +

function groups(list) {

  });
  return '<div class="list">' + Object.keys(g).sort(function (a, b) { return g[b].length - g[a].length || a.localeCompare(b, "fr"); }).map(function (k) {
    var min = Math.min.apply(null, g[k].map(function (x) { return x.best; }));
    return '<h3 class="grp">' + esc(k) + "<span>" + g[k].length + " dest. · dès " + eur(min) + "</span></h3>" + g[k].map(card).join("");

}

// ---------- carte ----------
function drawMap(list) {
  if (!window.L) { document.getElementById("map").innerHTML = '<p class="empty">Carte indisponible hors ligne.</p>'; return; }
  var pts = list.filter(function (x) { return x.lat != null; });
  if (!pts.length) { document.getElementById("map").outerHTML = '<div class="empty">La carte sera disponible après le prochain relevé des prix.</div>'; return; }
  MAP = L.map("map", { zoomControl: false }).setView(BOD, 5);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom: 18
  }).addTo(MAP);
  var bounds = [BOD];
  L.marker(BOD, { icon: L.divIcon({ className: "pin home", html: "<div>BOD</div>", iconSize: null }), zIndexOffset: 1000 }).addTo(MAP);
  pts.sort(function (a, b) { return a.best - b.best; }).forEach(function (x, i) {
    L.marker([x.lat, x.lng], {
      icon: L.divIcon({ className: "pin", html: "<div>" + eur(x.best) + "<small>" + esc(x.city) + "</small></div>", iconSize: null }),
      zIndexOffset: -i
    }).on("click", function () { openSheet(x.key); }).addTo(MAP);
    bounds.push([x.lat, x.lng]);
  });
  MAP.fitBounds(bounds, { padding: [40, 40], maxZoom: 6 });
}

      '<div class="btns" style="margin-top:8px"><a class="btn full" href="' + transit(x) + '" target="_blank" rel="noopener">Aéroport → centre en transports ↗</a></div></div>' +

    '<div class="sec"><h4>Dormir · ' + dm(o.out) + " → " + dm(o.ret) + " · 2 pers.</h4>" +
      (x.hotel ? '<p class="muted" style="margin:0 0 8px">Hôtels dès <b style="color:var(--ink)">' + eur(x.hotel) + "</b> la nuit selon Google.</p>" : "") +
      '<div class="btns"><a class="btn" href="' + booking(x, o.out, o.ret) + '" target="_blank" rel="noopener">Booking ↗</a>' +
      '<a class="btn" href="' + airbnb(x, o.out, o.ret) + '" target="_blank" rel="noopener">Airbnb ↗</a>' +
      '<a class="btn full" href="' + gHotels(x) + '" target="_blank" rel="noopener">Hôtels sur Google ↗</a></div></div>' +

    '<div class="sec"><h4>Météo · ' + span(o.out, o.ret) + '</h4><div id="wx" class="muted">Chargement…</div></div>' +
    '<div class="sec"><h4>Le coin</h4><div id="guide" class="guide muted">Chargement…</div></div>' +
    '<div class="sec"><div class="btns"><a class="btn main full" href="' + gf(x, o.out, o.ret) + '" target="_blank" rel="noopener">Voir les vols sur Google Flights ↗</a></div></div>' +
    "</div></div>";
  document.body.classList.add("lock");
  loadWeather(x, o);
  loadGuide(x);
}
function closeSheet() { SHEET = null; document.getElementById("sheet").innerHTML = ""; document.body.classList.remove("lock"); }

function loadWeather(x, o) {
  if (x.lat == null) { document.getElementById("wx").textContent = "Météo disponible après le prochain relevé des prix."; return; }
  var k = x.key + o.out + o.ret;
  var show = function (html) { WX[k] = html; var e = document.getElementById("wx"); if (e) { e.className = ""; e.innerHTML = html; } };
  if (WX[k]) return show(WX[k]);
  var ll = "latitude=" + x.lat + "&longitude=" + x.lng + "&timezone=auto";

  // Prevision si le retour est dans les 14 jours
  if (daysTo(o.ret) <= 14) {
    fetch("https://api.open-meteo.com/v1/forecast?" + ll + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&start_date=" + o.out + "&end_date=" + o.ret)
      .then(function (r) { return r.json(); }).then(function (j) {
        var d = j.daily;
        show('<div class="days">' + d.time.map(function (t, i) {
          return '<div class="day"><small>' + day(t) + '</small><div class="e">' + WMO(d.weather_code[i]) + "</div><b>" + Math.round(d.temperature_2m_max[i]) + "° / " + Math.round(d.temperature_2m_min[i]) + "°</b><small>pluie " + (d.precipitation_probability_max[i] == null ? "?" : d.precipitation_probability_max[i]) + " %</small></div>";
        }).join("") + '</div><p class="muted note">Prévisions Open-Meteo.</p>');
      }).catch(function () { show('<span class="muted">Météo indisponible.</span>'); });
    return;
  }

  // Sinon : moyenne des 3 dernieres annees aux memes dates
  var y = +o.out.slice(0, 4);
  var reqs = [1, 2, 3].map(function (n) {
    var s = (y - n) + o.out.slice(4), e = (y - n + (o.ret.slice(0, 4) > o.out.slice(0, 4) ? 1 : 0)) + o.ret.slice(4);
    return fetch("https://archive-api.open-meteo.com/v1/archive?" + ll + "&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,sunshine_duration&start_date=" + s + "&end_date=" + e)
      .then(function (r) { return r.json(); });
  });
  Promise.all(reqs).then(function (js) {
    var tx = [], tn = [], rain = 0, n = 0, sun = [];
    js.forEach(function (j) {
      var d = j.daily; if (!d) return;
      d.time.forEach(function (t, i) {
        if (d.temperature_2m_max[i] == null) return;
        tx.push(d.temperature_2m_max[i]); tn.push(d.temperature_2m_min[i]); n++;
        if (d.precipitation_sum[i] >= 1) rain++;
        if (d.sunshine_duration[i] != null) sun.push(d.sunshine_duration[i] / 3600);
      });
    });
    if (!n) throw 0;
    var avg = function (a) { return a.reduce(function (s, v) { return s + v; }, 0) / a.length; };
    var rp = Math.round(rain / n * 100);
    show('<div class="clim"><div><b>' + Math.round(avg(tx)) + "° / " + Math.round(avg(tn)) + "°</b><small>max / min</small></div>" +
      "<div><b>" + (rp < 20 ? "☀️ " : rp < 45 ? "🌤️ " : "🌧️ ") + rp + " %</b><small>des jours avec pluie</small></div>" +
      (sun.length ? "<div><b>" + Math.round(avg(sun)) + " h</b><small>de soleil par jour</small></div>" : "") +
      '</div><p class="muted note">Moyenne des 3 dernières années à ces dates. Prévisions précises à 2 semaines du départ.</p>');
  }).catch(function () { show('<span class="muted">Météo indisponible.</span>'); });
}

function loadGuide(x) {
  var show = function (html) { GUIDE[x.key] = html; var e = document.getElementById("guide"); if (e) { e.className = "guide"; e.innerHTML = html; } };
  if (GUIDE[x.key]) return show(GUIDE[x.key]);
  var t = encodeURIComponent(x.city.replace(/ /g, "_"));
  var get = function (host) {
    return fetch("https://" + host + "/api/rest_v1/page/summary/" + t).then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (j) { if (!j.extract || j.type === "disambiguation") throw 0; return j; });
  };
  var html = function (j, src) {
    var txt = j.extract.length > 700 ? j.extract.slice(0, 700).replace(/\s+\S*$/, "") + "…" : j.extract;
    return "<p>" + esc(txt) + '</p><a href="' + esc(j.content_urls.mobile.page) + '" target="_blank" rel="noopener">Lire la suite sur ' + src + " ↗</a>";
  };
  get("fr.wikivoyage.org").then(function (j) {
    // Les resumes Wikivoyage sont parfois tres courts : on complete avec Wikipedia
    if (j.extract.length > 250) return show(html(j, "Wikivoyage"));
    return get("fr.wikipedia.org").then(function (w) {
      show(html(w, "Wikipédia") + ' · <a href="' + esc(j.content_urls.mobile.page) + '" target="_blank" rel="noopener">Guide Wikivoyage ↗</a>');
    }, function () { show(html(j, "Wikivoyage")); });
  }).catch(function () {
    return get("fr.wikipedia.org").then(function (w) { show(html(w, "Wikipédia")); });
  }).catch(function () {
    show('<a href="https://www.google.com/search?q=' + encodeURIComponent("que faire à " + x.city + " en un weekend") + '" target="_blank" rel="noopener">Que faire à ' + esc(x.city) + " en un weekend ↗</a>");
  });
}

// ---------- evenements ----------
function rerender(keepScroll) {
  var y = window.scrollY;
  render();
  if (keepScroll) window.scrollTo(0, y);
}
document.addEventListener("click", function (e) {
  var t = e.target;
  if (t.id === "sheet-bg" || t.closest("#close")) { closeSheet(); return; }

  // Favori / deja fait : avant l'ouverture de la fiche (les boutons sont dans la carte)
  var fd = t.closest("[data-fav],[data-done]");
  if (fd) {
    if (fd.dataset.fav) toggleIn(FAV, fd.dataset.fav); else toggleIn(DONE, fd.dataset.done);
    saveSets();
    var open = SHEET;
    rerender(true);
    if (open && CUR[open]) openSheet(open); else if (open) closeSheet();
    return;
  }
  if (t.closest("#reset")) { e.preventDefault(); Object.assign(S, JSON.parse(JSON.stringify(DEFAULTS))); savePrefs(); rerender(true); return; }
  if (t.closest("a")) return; // liens externes

  var c = t.closest("[data-flag],[data-day],[data-n],[data-max],[data-sort],[data-group]");
  if (c) {
    var d = c.dataset;
    if (d.flag) S[d.flag] = !S[d.flag];
    if (d.day) toggleIn(S.days, +d.day);
    if (d.n) toggleIn(S.nights, +d.n);
    if (d.max != null) S.max = +d.max;
    if (d.sort) S.sort = d.sort;
    if (d.group) S.group = d.group;
    savePrefs(); rerender(true); return;
  }
  if (t.closest("#panel")) { S.panel = !S.panel; rerender(true); return; }
  if (t.closest("#panel-ok")) { S.panel = false; rerender(true); return; }

  if (t.closest("#surprise")) {
    var keys = Object.keys(CUR);
    if (!keys.length) return;
    var k = keys[Math.floor(Math.random() * keys.length)];
    if (S.view === "map") { openSheet(k); return; }
    var el = document.getElementById("c-" + k);
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
    setTimeout(function () { openSheet(k); }, 700);
    return;
  }

  var b = t.closest("[data-wk],[data-month],[data-mode],[data-view],[data-dest]");
  if (!b) return;
  if (b.dataset.dest) { openSheet(b.dataset.dest); return; }
  if (b.dataset.wk) { S.wk = b.dataset.wk; render(); return; }
  if (b.dataset.month) { S.month = b.dataset.month; render(); return; }
  if (b.dataset.mode) S.mode = b.dataset.mode;
  if (b.dataset.view) S.view = b.dataset.view;
  savePrefs(); render();
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
document.addEventListener("change", function (e) {
  if (e.target.id === "cal" && e.target.value) { S.wk = fridayOf(e.target.value); render(); }
});
document.addEventListener("input", function (e) {
  if (e.target.id !== "q") return;
  S.q = e.target.value;
  var pos = e.target.selectionStart;
  rerender(true);
  var q = document.getElementById("q");
  q.focus(); q.setSelectionRange(pos, pos);
});

// ---------- chargement ----------
function setData(d) {
  S.data = d;
  var fs = fridays(), ms = months();
  if (!S.wk) S.wk = fs.filter(function (f) { return combos(f).length; })[0] || fs[0];
  if (!S.month || ms.indexOf(S.month) === -1) S.month = ms[0] || null;
  // Pas encore de mois (ancien cache) : vue weekend en attendant, puis retour a la vue mois
  if (S.mode === "month" && !ms.length) { S.mode = "weekend"; S.auto = true; }
  else if (S.auto && ms.length) { S.mode = "month"; S.auto = false; }
  render();
}
try { var cached = JSON.parse(localStorage.getItem("wk-data") || "null"); if (cached) setData(cached); } catch (e) {}
fetch("data/weekends.json?t=" + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
  try { localStorage.setItem("wk-data", JSON.stringify(d)); } catch (e) {}
  setData(d);
}).catch(function () { if (!S.data) render(); });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js").catch(function () {});
</script>
