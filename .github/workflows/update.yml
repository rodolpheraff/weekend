name: Vols et publication

on:
  push:
    branches: [main]
  schedule:
    # lundi a 3h UTC : 6 mois + 44 weekends (releve tournant) = 50 requetes x ~4,3 passages = ~215 / mois (quota gratuit 250)
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pas de requete SerpApi sur un simple push de code
      - name: Recuperer les vols
        if: github.event_name != 'push'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node scripts/fetch.mjs

      - name: Enregistrer les donnees
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekends.json
          if ! git diff --staged --quiet; then
            git commit -m "Vols mis a jour"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
